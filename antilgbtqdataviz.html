<style>

.home{min-height:100%;display:flex;flex-direction:column;max-width:1320px;margin:0 auto;padding:64px 28px 30px}

.stage{position:relative;flex:1;min-height:340px;max-height:620px;perspective:1500px;margin-bottom:10px}
.card{position:absolute;left:50%;top:50%;width:min(66vw,640px);height:calc(100% - 28px);background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--red),10px 10px 0 var(--blue);display:flex;flex-direction:column;cursor:pointer;transition:transform .85s cubic-bezier(.2,.8,.2,1),opacity .6s ease;outline-offset:6px}

.clabel{position:absolute;left:14px;top:-18px;z-index:2;background:var(--ink);color:var(--ink-text);font-family:"Archivo Black",sans-serif;font-size:17px;padding:6px 14px;transform:skew(-3deg)}

.cbody{position:relative;flex:1;min-height:0;margin:22px 14px 14px;overflow:hidden;pointer-events:none}

/* full screen */
.full{position:fixed;inset:0;z-index:200;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:24px 24px;display:flex;flex-direction:column}

.top{display:flex;align-items:center;gap:20px;padding:14px 160px 12px 20px;border-bottom:3px solid var(--ink);background:var(--bg)}

.btn:hover{transform:translate(-2px,-2px)}
.vtitle{font-family:"Archivo Black",sans-serif;font-size:20px;background:var(--ink);color:var(--ink-text);padding:7px 16px;transform:skew(-3deg);margin:0 0 8px}
.vtitle span{display:inline-block;transform:skew(3deg)}
.body{flex:1;min-height:0;display:flex}
.menu{flex:0 0 210px;border-right:3px solid var(--ink);padding:18px 16px;background:var(--bg);overflow:auto}
.mh{font-family:"Archivo Black",sans-serif;font-size:14px;margin:0 0 12px}
.menu button{display:block;width:100%;text-align:left;font-size:15px;font-weight:700;background:none;border:3px solid transparent;padding:8px 10px;cursor:pointer}
.menu button::before{content:"\2192\00a0";color:var(--red)}
.menu button:hover{border-color:var(--ink)}
.menu button[aria-current=true]{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 20px 16px}
.ctl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;min-height:54px;margin-bottom:8px}
.ctl[hidden],.ctl > [hidden]{display:none}
.yr{flex:1 1 280px;max-width:520px}
#ymode{margin:6px 0 4px}
.range[hidden],.chips[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:13px;font-weight:700;padding:5px 11px;border:3px solid var(--ink);background:var(--bg);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--ink-text)}
.yrtop{display:flex;justify-content:flex-start;align-items:baseline;font-size:13px;color:var(--muted)}
.yearlab{font-family:"Archivo Black",sans-serif;font-size:28px;color:var(--text);line-height:1.1}
.range{width:100%;accent-color:var(--ink)}
.seg{display:inline-flex;border:3px solid var(--ink)}
.seg button{font-size:13px;font-weight:700;padding:6px 12px;border:0;background:var(--bg);cursor:pointer}
.seg button+button{border-left:3px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--ink-text)}
.vz{position:relative;flex:1;min-height:0;overflow:hidden}
.vz.scroll{overflow:auto}
.foot{flex:0 0 auto;padding-top:8px}
.foot[hidden]{display:none}
.cap{font-size:12px;color:var(--muted);margin:0 0 4px}
.bar{display:flex;height:30px;gap:3px}
.seg3{flex:1 1 0;min-width:0;display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;color:#fff}
.years{display:flex;gap:6px;align-items:flex-end;margin-top:6px}
.ycol{flex:1 1 0;min-width:0;font-size:12px;background:none;border:0;border-bottom:3px solid transparent;padding:2px 2px 2px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.ycol.on{border-bottom-color:var(--ink);font-weight:700}
.stack{display:flex;flex-direction:column-reverse;gap:1px;margin-bottom:4px}
.stack div{flex-basis:0}
.callout{position:absolute;z-index:3;background:var(--bg);color:var(--text);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--red),10px 10px 0 var(--blue);padding:10px 14px;font-weight:500;line-height:1.6}
.hl{font-family:"Archivo Black",sans-serif;font-weight:400;padding:1px 6px;color:#fff}
.hk{background:var(--ink);color:var(--ink-text)}.hb{background:var(--blue)}.hr{background:var(--red)}
.legend{position:absolute;left:0;bottom:0;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;z-index:2}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.ramp{display:inline-block;width:110px;height:10px;vertical-align:middle;margin:0 6px;border:2px solid var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;width:100%}
.q{font:inherit;font-size:15px;padding:8px 12px;border:3px solid var(--ink);background:var(--bg);color:var(--text);min-width:200px;flex:1 1 220px;max-width:380px}
.pager{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.pager button{width:36px;height:36px;border:3px solid var(--ink);background:var(--bg);cursor:pointer;font-size:16px;font-weight:700}
.pager button:disabled{opacity:.3;cursor:default}
.dl{margin-left:auto;margin-bottom:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:"Archivo Black",sans-serif;font-weight:400;font-size:13px;padding:9px 10px;border-bottom:3px solid var(--ink);white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--bg)}
td{padding:8px 10px;border-bottom:1px solid var(--dot);vertical-align:top}
tbody tr:nth-child(odd){background:var(--panel)}
td.s-passed{color:var(--red);font-weight:700}td.s-alive{color:var(--blue);font-weight:700}
.mini table{font-size:11px}.mini th{font-size:10px;padding:5px 6px;cursor:default;position:static}.mini td{padding:4px 6px}
.tip{position:fixed;z-index:400;pointer-events:none;background:var(--ink);color:var(--ink-text);font-size:13px;line-height:1.4;padding:7px 10px;max-width:240px;display:none}
.tip b{font-family:"Archivo Black",sans-serif;font-weight:400;display:block;font-size:14px}
.tabs{align-self:flex-start;margin:0 0 22px}
.edit-toggle{position:fixed;top:16px;right:80px;z-index:300;width:40px;height:40px;padding:0;border:3px solid var(--ink);background:var(--bg);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
.edit-toggle .ic-open{display:none}
body.editing .edit-toggle .ic-open{display:block}
body.editing .edit-toggle .ic-lock{display:none}
.edit-toggle[hidden],.editbar[hidden],.copyov[hidden]{display:none}
body.editing .edit-toggle{background:var(--red);color:#fff;border-color:var(--red)}
body.editing [contenteditable=true]{outline:2px dashed var(--blue);outline-offset:3px;cursor:text}
body.editing .pg{padding-bottom:110px}
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:260;background:var(--ink);color:var(--ink-text);border-top:3px solid var(--red);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:10px 16px}
.editbar button,.copyrow button{border:2px solid var(--ink-text);background:transparent;color:var(--ink-text);font-weight:700;padding:8px 14px;cursor:pointer;font-size:14px;font-family:inherit}
.copyov{position:fixed;inset:0;z-index:280;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:24px}
.copyin{display:flex;flex-direction:column;gap:10px;width:100%;max-width:820px}
.copyin textarea{width:100%;height:68vh;font-family:ui-monospace,Menlo,monospace;font-size:13px;padding:14px;border:3px solid var(--ink);background:var(--bg);color:var(--text)}
.copyrow{display:flex;gap:10px}
.copyrow button{background:var(--red);border-color:#fff;color:#fff}
.stage[hidden],.dots[hidden],#homepage[hidden]{display:none}
.pg{max-width:780px;font-size:16px;line-height:1.65;padding:2px 2px 40px}
.pg h3{font-family:"Archivo Black",sans-serif;font-weight:400;font-size:17px;display:inline-block;margin:26px 0 12px;background:var(--ink);color:var(--ink-text);padding:6px 14px;transform:skew(-3deg)}
.pg h3:first-child{margin-top:4px}
.pg h3 span{display:inline-block;transform:skew(3deg)}
.pg p{margin:0 0 14px}
.pg a{color:var(--text);font-weight:700;text-decoration:none;background-image:linear-gradient(120deg,rgba(255,138,138,.45),rgba(255,138,138,.45));background-repeat:no-repeat;background-size:100% .9em;background-position:0 88%;padding:0 1px}
.pg a:hover{background-image:linear-gradient(120deg,rgba(28,63,216,.4),rgba(28,63,216,.4))}

.pg li::before{content:"";position:absolute;left:0;top:7px;width:15px;height:15px;background:var(--red)}
.pg li:nth-child(even)::before{background:var(--blue)}
.stats{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 22px}
.stat{border:3px solid var(--ink);padding:8px 14px;background:var(--panel);min-width:120px}

.stat span{font-size:13px;color:var(--muted)}
.pg .small{font-size:14px;color:var(--muted)}
.pg li code,.pg p code,.pg td code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--panel);border:1px solid var(--dot);padding:0 4px;word-break:break-all}
.pg table{margin:0 0 20px;font-size:14px}
.pg th{cursor:default;position:static}
.cb{border:3px solid var(--ink);margin:0 0 22px;background:var(--panel)}

.cbh{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:3px solid var(--ink);flex-wrap:wrap}
.cbn{font-family:"Archivo Black",sans-serif;font-size:12px;color:#fff;background:var(--blue);padding:3px 8px}
.cb.r .cbn{background:var(--red)}
.cbt{font-weight:700;font-size:14px}
.cbr{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px}
.cbtn{font:inherit;font-size:12px;font-weight:700;background:var(--bg);color:var(--text);border:2px solid var(--ink);padding:2px 9px;cursor:pointer}
.cb pre{margin:0;padding:12px 14px;overflow:auto;max-height:380px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;white-space:pre;tab-size:4}
.cb .cm{color:var(--muted)}
.pg li[data-step]{scroll-margin-top:12px}
.cb.wrap pre{white-space:pre-wrap;word-break:break-word}
td a{color:var(--text);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
td a:hover{color:var(--blue)}
.cb{scroll-margin-top:12px}
@keyframes flash-hit{0%{box-shadow:0 0 0 6px rgba(216,30,44,.4)}100%{box-shadow:0 0 0 0 rgba(216,30,44,0)}}
@media (prefers-reduced-motion:reduce){.cb.flash{animation:none}}
@media (max-width:760px){
 .home{padding:60px 16px 20px}
 .card{width:78vw}

 .body{flex-direction:column}
 .menu{flex:0 0 auto;border-right:0;border-bottom:3px solid var(--ink);padding:8px 10px;display:flex;gap:4px;overflow-x:auto}
 .mh{display:none}
 .menu button{width:auto;white-space:nowrap;padding:6px 8px}
 .main{padding:10px 12px 12px}
 .hide-n{display:none}
 .seg3{padding:0 6px;font-size:12px}
}
@media (max-width:560px){h1{font-size:7.4vw;text-shadow:2px 2px 0 var(--red)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

ink\"]:\n        if c not in raw.columns:\n            raw[c] = \"\"\n        raw[c] = raw[c].fillna(\"\").str.strip()\n\n    rows = []\n    gone = {\"blank\": 0, \"footer\": 0, \"good\": 0, \"state\": 0, \"bill\": 0}\n    for r in raw.to_dict(\"records\"):\n        if not r[\"State\"] and not r[\"Bill Name\"]:\n            gone[\"blank\"] += 1\n            continue\n        if r[\"State\"].lower().startswith(\"data is current\"):\n            gone[\"footer\"] += 1\n            continue\n        st = get_state(r[\"State\"])\n        if not st:\n            gone[\"state\"] += 1\n            continue\n        cat = r[\"Issues\"].split(\"|\")[0].strip().lower()\n        if not keep_all and cat in GOOD:\n            gone[\"good\"] += 1\n            continue\n        try:\n            sd = dateparser.parse(r[\"Status Date\"]) if r[\"Status Date\"] else None\n        except (ValueError, OverflowError):\n            sd = None\n        # some cells have two bills in them, like SB 2077/HB 1572\n        for part in re.split(r\"\\s*(?:/|;|,|&|\\band\\b)\\s*\", r[\"Bill Name\"]):\n            if not part.strip():\n                continue\n            pb = parse_bill(part)\n            if not pb:\n                gone[\"bill\"] += 1\n                continue\n            yr = sd.year if sd else (pb[2] or year_from_name(r[\"source_file\"]))\n            rows.append({\n                \"state\": st, \"bill_raw\": r[\"Bill Name\"], \"bill_key\": pb[0] + str(pb[1]), \"year\": yr,\n                \"status_date\": sd.date().isoformat() if sd else \"\",\n                \"issue_category\": r[\"Issues\"].split(\"|\")[0].strip(), \"issue_detail\": r[\"Issues\"],\n                \"status\": r[\"Status\"], \"status_detail\": r[\"Status Detail\"],\n                \"court_link\": r[\"In Court Link\"], \"source_file\": r[\"source_file\"]})\n    print(\"dropped:\", gone)\n\n    df = pd.DataFrame(rows)\n    df[\"year\"] = df[\"year\"].astype(\"Int64\")\n    # the same bill is in a bunch of files so squash to one row per state/bill/year\n    df = df.sort_values(\"status_date\").groupby([\"state\", \"bill_key\", \"year\"], dropna=False).agg(\n        bill_raw=(\"bill_raw\", \"first\"), status_date=(\"status_date\", \"last\"),\n        status=(\"status\", \"last\"), status_detail=(\"status_detail\", \"last\"),\n        issue_category=(\"issue_category\", lambda s: \" | \".join(dict.fromkeys(s))),\n        issue_detail=(\"issue_detail\", lambda s: \" || \".join(dict.fromkeys(s))),\n        court_link=(\"court_link\", lambda s: next((x for x in s if x), \"\")),\n        source_file=(\"source_file\", lambda s: \" | \".join(dict.fromkeys(s))),\n    ).reset_index()\n    # a row with no year is a dupe if that bill already has one with a year\n    dated = df[df[\"year\"].notna()].set_index([\"state\", \"bill_key\"]).index\n    dupe = df[\"year\"].isna() & df.set_index([\"state\", \"bill_key\"]).index.isin(dated)\n    return df[~dupe].reset_index(drop=True)"},{"t":"drop pro-equality bills","x":"# the pro-equality categories. these get dropped unless you pass --keep-all\nGOOD = {\"lgbtq equality bills\", \"nondiscrimination protections\", \"other good bills\",\n        \"sex work discriminalization bills\", \"allowing updated gender markers on id\",\n        \"protections in healthcare\"}\n\n# inside clean_rows, one row at a time\ncat = r[\"Issues\"].split(\"|\")[0].strip().lower()\nif not keep_all and cat in GOOD:\n    gone[\"good\"] += 1\n    continue"},{"t":"tracker year","x":"# each file is one tracker year, so the file name decides the year\nyear_of = {\"legislation-tracker_2020.csv\":2020, \"2021-legislation-tracker_2021.csv\":2021, \"legislation-tracker_2022.csv\":2022,\n \"legislation-tracker_2026-07-04_23-33.csv\":2023, \"legislation-tracker_2026-07-04_23-33__1_.csv\":2024,\n \"legislation-tracker_2026-07-04_23-33__2_.csv\":2025, \"legislation-tracker_2026-07-04_23-34.csv\":2026}\nraw[\"tracker_year\"] = raw[\"source_file\"].map(year_of)"},{"t":"sort the outcomes","x":"# tracker wording in, passed / dead / advancing out\ns = (r[\"Status\"]+\" | \"+r[\"Status Detail\"]).lower()\nif re.search(r\"signed|approved by governor|passed into law|became an act|overrid|partially vetoed\", s): g=\"passed\"\nelif re.search(r\"died|dead|defeat|failed|withdrawn|indefinite|vetoed|adjourn|session ended|substitu|tabled\", s): g=\"dead\"\nelse: g=\"advancing\""},{"t":"look up bills and save text","x":"def search(state, key, year):\n    d = legiscan(\"getSearch\", f\"search_{state}_{key}_{year}\", state=state, bill=key, year=year)\n    hits = []\n    for k, v in d.get(\"searchresult\", {}).items():\n        if not (isinstance(v, dict) and \"bill_id\" in v):\n            continue\n        pb = parse_bill(v.get(\"bill_number\", \"\"))\n        if v.get(\"state\") == state and pb and pb[0] + str(pb[1]) == key:\n            hits.append(v)\n    return hits\n\ndef find_bill(state, key, year, sdate):\n    hits = search(state, key, int(year)) if year else []\n    if not hits:\n        hits = search(state, key, 1)  # 1 means all years\n    if not hits:\n        return None\n    # more than one session? take the one closest to the status date\n    if len(hits) > 1:\n        if sdate:\n            t = pd.Timestamp(sdate)\n            hits.sort(key=lambda h: abs(pd.Timestamp(h.get(\"last_action_date\") or \"1900-01-01\") - t))\n        else:\n            hits.sort(key=lambda h: h.get(\"last_action_date\") or \"\", reverse=True)\n    return hits[0]\n\ndef to_text(blob, mime):\n    mime = (mime or \"\").lower()\n    if \"html\" in mime:\n        soup = BeautifulSoup(blob.decode(\"utf-8\", errors=\"ignore\"), \"html.parser\")\n        for t in soup([\"script\", \"style\"]):\n            t.decompose()\n        return soup.get_text(\"\\n\")\n    if \"pdf\" in mime:\n        from pypdf import PdfReader\n        return \"\\n\".join((p.extract_text() or \"\") for p in PdfReader(io.BytesIO(blob)).pages)\n    if \"wordprocessingml\" in mime or mime.endswith(\"docx\"):\n        xml = zipfile.ZipFile(io.BytesIO(blob)).read(\"word/document.xml\").decode(\"utf-8\", errors=\"ignore\")\n        return re.sub(r\"<[^>]+>\", \"\", xml.replace(\"<\/w:p>\", \"\\n\"))\n    if mime.startswith(\"text/\"):\n        return blob.decode(\"utf-8\", errors=\"ignore\")\n    return None  # old .doc / rtf / wordperfect, skipping those\n\ndef tidy(t):\n    t = unicodedata.normalize(\"NFKC\", t).replace(\"\\xa0\", \" \")\n    keep = []\n    for ln in t.splitlines():\n        ln = re.sub(r\"[ \\t]+\", \" \", ln).strip()\n        if re.fullmatch(r\"\\d{1,3}\", ln):  # line numbers and page numbers on their own\n            continue\n        keep.append(ln)\n    return re.sub(r\"\\n{3,}\", \"\\n\\n\", \"\\n\".join(keep)).strip()"},{"t":"file names and results table","x":"# one text file per bill version\nfn = f\"{FILE_PREFIX}_{r['state']}_{r['bill_key']}_{bid}_{v}.txt\"\n\n# one results row per bill version\nrow = dict(base, version=v, doc_type=tx.get(\"type\", \"\"), doc_date=tx.get(\"date\", \"\"),\n           mime=mime, text_path=path, fetch_status=status)"}]}</script>
<script>
(function(){
const DATA=JSON.parse(document.getElementById('data').textContent);
const $=(s,r)=>(r||document).querySelector(s);
const NS='http://www.w3.org/2000/svg';
const fmt=(n)=>Number(n).toLocaleString('en-US');
const ST=['passed','alive','died'];
const COL={passed:'var(--red)',alive:'var(--blue)',died:'var(--dead)'};
const REGORD=['northeast','south','west','midwest'];
const VIZ=[
  {id:'blocks',name:'bill blocks',kind:'map',mode:'blocks'},
  {id:'hex',name:'hexagons',kind:'map',mode:'hex'},
  {id:'wheel',name:'the wheel',kind:'wheel'},
  {id:'db',name:'database',kind:'table'},
  {id:'source',name:'source',kind:'page'},
  {id:'data',name:'data',kind:'page'},
  {id:'cite',name:'how to cite this',kind:'page'}
];
const CH=VIZ.filter(v=>v.kind!=='page');
const GITHUB_URL='https://github.com/love-adu/anti-lgbtq-laws-in-the-us';
const TEXT_BASE=GITHUB_URL+'/blob/main/billtextdeclassed/text/';
const RAW_BASE='https://raw.githubusercontent.com/love-adu/anti-lgbtq-laws-in-the-us/main/billtextdeclassed/text/';
const HASTX=!!(DATA.tx&&Object.keys(DATA.tx).length);

function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

/* data */
const S=DATA.s.map(a=>({state:a[0],name:a[1],region:a[2],x:a[3],y:a[4]}));
const stateBy={};S.forEach(s=>stateBy[s.state]=s);
const SY=new Map();
DATA.sy.forEach(a=>SY.set(a[0]+'|'+a[1],{state:a[0],year:a[1],passed:a[2],alive:a[3],died:a[4],total:a[2]+a[3]+a[4]}));
const years=[...new Set(DATA.sy.map(a=>a[1]))].sort((a,b)=>a-b);
const YT=new Map();
years.forEach(y=>YT.set(y,{year:y,passed:0,alive:0,died:0,total:0}));
SY.forEach(r=>{const t=YT.get(r.year);ST.forEach(k=>t[k]+=r[k]);t.total+=r.total;});
let gMax=0,maxPct=0;
SY.forEach(r=>{gMax=Math.max(gMax,r.total);if(r.total>0)maxPct=Math.max(maxPct,100*r.passed/r.total);});
const META=DATA.meta;
const B=DATA.b.map(a=>({year:a[0],state:a[1],bill:a[2],issue:a[3],status:a[4],raw:a[5]}));

const lastY=years[years.length-1];
const ui={ym:{mode:'one',year:lastY,set:new Set(years.slice(-2))},yt:{mode:'all',year:lastY,set:new Set(years.slice(-2))},metric:'count',sel:null,page:0,q:'',sort:{k:'year',dir:-1}};
function ySel(Y){if(Y.mode==='all')return years.slice();if(Y.mode==='multi'){const a=years.filter(y=>Y.set.has(y));return a.length?a:[Y.year];}return [Y.year];}
function listLabel(a){if(a.length===1)return String(a[0]);const cons=a.every((v,i)=>i===0||v===a[i-1]+1);if(cons&&a.length>=3)return a[0]+' to '+a[a.length-1];return a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
function yLabel(Y){return Y.mode==='all'?years[0]+' to '+lastY:listLabel(ySel(Y));}
const aggCache=new Map();
function agg(sel){
  const key=sel.join(',');let m=aggCache.get(key);if(m)return m;
  const ys=new Set(sel),latest=new Map();
  B.forEach(b=>{if(!ys.has(b.year)||!stateBy[b.state])return;const k=b.state+'|'+b.bill,c=latest.get(k);if(!c||b.year>c.year)latest.set(k,b);});
  m=new Map();S.forEach(s=>m.set(s.state,{state:s.state,passed:0,alive:0,died:0,total:0}));
  const tot={passed:0,alive:0,died:0,total:0};
  latest.forEach(b=>{const r=m.get(b.state);r[b.status]++;r.total++;tot[b.status]++;tot.total++;});
  m.totals=tot;aggCache.set(key,m);return m;
}
const curA=()=>agg(ySel(ui.ym));
function scaleMax(A){if(ui.ym.mode==='one')return gMax;let m=1;A.forEach(r=>{m=Math.max(m,r.total);});return m;}
function pctMax(A){if(ui.ym.mode==='one')return maxPct;let m=1;A.forEach(r=>{if(r.total>0)m=Math.max(m,100*r.passed/r.total);});return m;}
const curY=()=>VIZ[cur].kind==='table'?ui.yt:ui.ym;
function toggleYear(Y,yv){const s=new Set(ySel(Y));if(s.has(yv)){if(s.size>1)s.delete(yv);}else s.add(yv);Y.set=s;}
let cur=0,act=0,openNow=false,paused=false,hoverT=null,rows=[],homeTab='charts',dirty=false;

/* theme */
const themeBtn=$('#theme');
function themeLabel(){themeBtn.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';}
themeBtn.addEventListener('click',()=>{const r=document.documentElement,d=r.getAttribute('data-theme')==='dark';
  if(d){r.removeAttribute('data-theme');try{localStorage.setItem('theme','light')}catch(e){}}else{r.setAttribute('data-theme','dark');try{localStorage.setItem('theme','dark')}catch(e){}}
  themeLabel();});
themeLabel();

/* tooltip */
const tip=$('#tip');
function tipShow(e,st){const r=curA().get(st.state);tip.replaceChildren();tip.append(h('b',null,st.name),
  h('div',null,r&&r.total>0?fmt(r.total)+' bills: '+r.passed+' passed, '+r.alive+' alive, '+r.died+' died':'no bills'));
  tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-250)+'px';tip.style.top=Math.min(e.clientY+14,innerHeight-80)+'px';}
const tipHide=()=>{tip.style.display='none';};

const hexPath=(cx,cy,s)=>{let d='';for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30);d+=(k?'L':'M')+(cx+s*Math.cos(a)).toFixed(1)+','+(cy+s*Math.sin(a)).toFixed(1);}return d+'Z';};

/* tile map: blocks or hexagons */
function drawMap(host,mode,mini){
  host.replaceChildren();
  const W=host.clientWidth,H=host.clientHeight;if(W<40||H<40)return;
  const unit=Math.min(W/12.5,(H-(mini?4:30))/(7*0.866+1.2));
  const s=unit/Math.sqrt(3),rowH=unit*0.866;
  const ox=(W-unit*12.5)/2,oy=Math.max(0,(H-(rowH*7+2*s))/2-(mini?0:8));
  const svg=sv('svg',{width:W,height:H},host);
  const A=curA(),sm=scaleMax(A),pm=pctMax(A),cols=Math.ceil(Math.sqrt(sm)),p=(unit*0.78)/cols;
  S.forEach(st=>{
    const cx=ox+unit*(st.x+0.75),cy=oy+s+st.y*rowH;
    const r=A.get(st.state),tot=r?r.total:0,on=!mini&&ui.sel===st.state;
    const g=sv('g',{},svg);
    if(mode==='hex'){
      sv('path',{d:hexPath(cx,cy,s*0.97),style:'fill:'+(tot>0?'var(--panel)':'var(--none)')+';stroke:var(--ink);stroke-width:'+(on?3:1)},g);
      let lab='var(--text)';
      if(tot>0){
        const v=ui.metric==='count'?Math.sqrt(tot/sm):(100*r.passed/tot)/pm;
        const op=0.12+0.88*Math.min(1,v);
        sv('path',{d:hexPath(cx,cy,s*0.97),style:'fill:'+(ui.metric==='count'?'var(--blue)':'var(--red)')+';fill-opacity:'+op.toFixed(2)},g);
        if(op>0.55)lab='#fff';
      }
      if(unit>=26){const t=sv('text',{x:cx,y:cy+unit*0.07,'text-anchor':'middle','font-size':Math.max(8,unit*0.21),'font-weight':700,style:'fill:'+lab},g);t.textContent=st.state;}
    }else{
      sv('path',{d:hexPath(cx,cy,s*0.97),style:'fill:var(--panel);stroke:var(--ink);stroke-width:'+(on?3:1)+';stroke-opacity:'+(on?1:0.25)},g);
      if(!mini||unit>=30){const t=sv('text',{x:cx,y:cy-s*0.6,'text-anchor':'middle','font-size':Math.max(7,unit*0.16),style:'fill:var(--muted)'},g);t.textContent=st.state;}
      if(r&&tot>0){
        const rowsN=Math.ceil(tot/cols);let i=0;
        ST.forEach(k=>{for(let j=0;j<r[k];j++,i++){const row=Math.floor(i/cols),col=i%cols,inRow=Math.min(cols,tot-row*cols);
          sv('rect',{x:cx-inRow*p/2+col*p,y:cy-rowsN*p/2+row*p+unit*0.07,width:Math.max(1,p-1.2),height:Math.max(1,p-1.2),style:'fill:'+COL[k]},g);}});
      }
    }
    if(!mini){
      g.style.cursor='pointer';
      g.addEventListener('mousemove',e=>tipShow(e,st));
      g.addEventListener('mouseleave',tipHide);
      g.addEventListener('click',()=>{ui.sel=ui.sel===st.state?null:st.state;refresh();});
    }
  });
  if(mini)return;
  const co=h('div','callout');
  const hl=(c,t)=>h('span','hl '+c,t);
  const T=(t)=>document.createTextNode(t);
  const lab=yLabel(ui.ym),pre=ySel(ui.ym).length===1?'in ':'across ';
  if(ui.sel){const st=stateBy[ui.sel],r=A.get(ui.sel);
    co.append(T('this is '),hl('hk',st.name),T('. '+pre+lab+' it had '),hl('hb',fmt(r.total)),T(' bills and '),hl('hr',fmt(r.passed)),T(' passed into law.'));
  }else{const t=A.totals;
    co.append(T(pre+lab+' the us had '),hl('hb',fmt(t.total)),T(' bills. '),hl('hr',fmt(t.passed)),T(' passed into law and '),hl('hk',fmt(t.died)),T(' died.'));}
  co.style.fontSize=Math.max(14,Math.min(20,unit*0.26))+'px';
  if(W>=700){co.style.left=(ox+unit*1.7)+'px';co.style.top=(oy+2)+'px';co.style.width=(unit*6.9)+'px';}
  else{co.style.left='6px';co.style.top='4px';co.style.right='16px';}
  host.append(co);
  const lg=h('div','legend');
  const add=(html)=>{const sp=document.createElement('span');sp.innerHTML=html;lg.append(sp);};
  if(mode==='blocks'){add('<i style="background:var(--red)"></i>passed into law');add('<i style="background:var(--blue)"></i>still alive');add('<i style="background:var(--dead)"></i>died');}
  else{const c=ui.metric==='count'?'var(--blue)':'var(--red)';
    add('0<span class="ramp" style="background:linear-gradient(90deg,transparent,'+c+')"></span>'+(ui.metric==='count'?fmt(sm)+' bills':Math.round(pm)+'% passed'));
    add('<i style="background:var(--none)"></i>no bills');}
  host.append(lg);
}

/* wheel */
function drawWheel(host,mini){
  host.replaceChildren();
  const W0=host.clientWidth,H0=host.clientHeight;if(W0<40||H0<40)return;
  const W=Math.min(W0,H0);
  const svg=sv('svg',{width:W0,height:H0,viewBox:((W-W0)/2)+' '+((W-H0)/2)+' '+W0+' '+H0},host);
  const cx=W/2,cy=W/2,r0=W*0.14,rMax=W*0.5-W*(mini?0.03:0.085);
  const order=S.slice().sort((a,b)=>REGORD.indexOf(a.region)-REGORD.indexOf(b.region)||a.state.localeCompare(b.state));
  const gap=0.14,step=(2*Math.PI-4*gap)/order.length;
  let ang=gap/2,last=null;const pos={};
  order.forEach(st=>{if(last&&st.region!==last)ang+=gap;pos[st.state]=ang+step/2;ang+=step;last=st.region;});
  const xy=(a,r)=>[cx+r*Math.sin(a),cy-r*Math.cos(a)];
  const A=curA(),sm=scaleMax(A);
  const L=(rMax-r0)/Math.sqrt(sm),rad=(v)=>r0+L*Math.sqrt(v);
  if(!mini)[10,25,50,100,250,500].filter(v=>v<=sm*1.05).forEach(v=>{
    sv('circle',{cx,cy,r:rad(v),fill:'none',style:'stroke:var(--dot)'},svg);
    const t=sv('text',{x:cx+3,y:cy+rad(v)-2,'font-size':Math.max(8,W*0.014),style:'fill:var(--muted)'},svg);t.textContent=v;});

/* database */
function filtered(){
  const q=ui.q.trim().toLowerCase(),ys=new Set(ySel(ui.yt));let r=B.filter(b=>ys.has(b.year));
  if(q)r=r.filter(b=>(b.year+' '+b.state+' '+b.bill+' '+b.issue+' '+b.status+' '+b.raw).toLowerCase().includes(q));
  const k=ui.sort.k,d=ui.sort.dir;
  return r.slice().sort((a,b)=>{const c=k==='year'?a.year-b.year:String(a[k]).localeCompare(String(b[k]),undefined,{numeric:true});
    return (c*d)||a.state.localeCompare(b.state)||a.bill.localeCompare(b.bill,undefined,{numeric:true});});
}
const COLS=[['year','year'],['state','state'],['bill','bill'],['issue','issue'],['status','outcome'],['raw','specific outcome']];
function txName(b,ver){return 'billis_'+b.state+'_'+b.bill.replace(/\s+/g,'')+'_'+DATA.tx[b.year+'|'+b.state+'|'+b.bill.replace(/\s+/g,'')].id+'_'+ver+'.txt';}
function txFor(b){return HASTX?DATA.tx[b.year+'|'+b.state+'|'+b.bill.replace(/\s+/g,'')]:null;}
function downloadText(url,fn){
  fetch(url).then(r=>{if(!r.ok)throw new Error('x');return r.blob();}).then(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fn;document.body.append(a);a.click();a.remove();})
    .catch(()=>{window.open(url,'_blank','noopener');});
}
function txCell(b,kind){

function drawTable(host,mini){

function place(){
  const n=cards.length;
  cards.forEach((c,i)=>{
    const rel=((i-act)%n+n)%n;let t,z,o=1;
    if(rel===0){t='translateX(0) scale(1) rotateY(0deg)';z=3;}
    else if(rel===1){t='translateX(55%) scale(.76) rotateY(-30deg)';z=2;o=.92;}
    else if(rel===n-1){t='translateX(-55%) scale(.76) rotateY(30deg)';z=2;o=.92;}
    else{t='translateX(0) scale(.55) rotateY(0deg)';z=0;o=0;}
    c.style.transform='translate(-50%,-50%) '+t;c.style.zIndex=z;c.style.opacity=o;
    c.style.pointerEvents=o===0?'none':'auto';c.classList.toggle('front',rel===0);
  });

function openViz(i){

  if(!reduce)full.animate([{clipPath:'inset('+r.top+'px '+(innerWidth-r.right)+'px '+(innerHeight-r.bottom)+'px '+r.left+'px)'},{clipPath:'inset(0px 0px 0px 0px)'}],{duration:460,easing:'cubic-bezier(.2,.8,.2,1)'});
}
function closeViz(){
  if(!openNow)return;tipHide();

  const done=()=>{full.hidden=true;document.body.classList.remove('lock');openNow=false;renderCards();syncEdit();};
  if(reduce){done();return;}
  const a=full.animate([{clipPath:'inset(0px 0px 0px 0px)'},{clipPath:'inset('+r.top+'px '+(innerWidth-r.right)+'px '+(innerHeight-r.bottom)+'px '+r.left+'px)'}],{duration:380,easing:'cubic-bezier(.4,0,.2,1)'});
  a.onfinish=done;
}
$('#back').addEventListener('click',closeViz);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViz();});

/* editing the text pages */
const pageCache={};
function pageNode(id){let n=pageCache[id];if(!n){n=pageEl(id);pageCache[id]=n;if(isEditing())makeEditable(n,true);}return n;}
const isEditing=()=>document.body.classList.contains('editing');
function makeEditable(n,on){
  n.querySelectorAll('h3 span,p,li,td,th,.cbt').forEach(el=>{if(on)el.setAttribute('contenteditable','true');else el.removeAttribute('contenteditable');});
  n.querySelectorAll('a.cl,button').forEach(el=>el.setAttribute('contenteditable','false'));
}
const homePage=$('#homepage'),editBtn=$('#edit'),editBar=$('#editbar'),ov=$('#copyov'),ta=$('#copyta');
function pageShown(){return openNow?VIZ[cur].kind==='page':homeTab!=='charts';}
function setEditing(on){
  document.body.classList.toggle('editing',on);editBar.hidden=!(on&&pageShown());editBtn.setAttribute('aria-label',on?'lock editing':'log in to edit');
  ['source','data','cite'].forEach(id=>makeEditable(pageNode(id),on));
}
function syncEdit(){editBar.hidden=!(isEditing()&&pageShown());}

/* the lock. the password is never in this file, only a salted hash of it. set it once with the first-run step below */
const EDIT_SALT='';
const EDIT_HASH='';
const EDIT_ITER=200000;
async function derive(pw,saltHex){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const salt=Uint8Array.from(saltHex.match(/../g).map(x=>parseInt(x,16)));
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:EDIT_ITER,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function askPassword(){
  if(!window.crypto||!crypto.subtle){alert('the lock needs https, so use the live page');return false;}
  if(!EDIT_HASH){
    const pw=prompt('no editing password is set yet. type the one you want (use something long and different from your site password):');
    if(!pw)return false;
    const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
    const hash=await derive(pw,salt);
    ta.value="// paste these over the two empty lines that start with const EDIT_SALT and const EDIT_HASH in the html file\nconst EDIT_SALT='"+salt+"';\nconst EDIT_HASH='"+hash+"';";
    ov.hidden=false;ta.focus();ta.select();
    return false;
  }
  const pw=prompt('password to edit');
  if(!pw)return false;
  if((await derive(pw,EDIT_SALT))!==EDIT_HASH){alert('wrong password');return false;}
  return true;
}
editBtn.addEventListener('click',async()=>{
  if(isEditing()){setEditing(false);return;}
  if(await askPassword())setEditing(true);
});
function showCurrentPage(){
  if(openNow){if(VIZ[cur].kind==='page')vz.replaceChildren(pageNode(VIZ[cur].id));}
  else if(homeTab!=='charts')homePage.replaceChildren(pageNode(homeTab));
}
document.addEventListener('keydown',e=>{if(isEditing()&&e.target.isContentEditable&&e.key==='Enter'&&!e.shiftKey)e.preventDefault();});
document.addEventListener('paste',e=>{if(!isEditing()||!e.target.isContentEditable)return;e.preventDefault();
  document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));});
document.addEventListener('input',e=>{if(isEditing()&&e.target.closest&&e.target.closest('.pg'))dirty=true;});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

function inl(n){
  let s='';
  n.childNodes.forEach(c=>{
    if(c.nodeType===3){s+=c.nodeValue;return;}
    if(c.nodeType!==1||c.matches('a.cl'))return;
    const x=inl(c);
    if(c.tagName==='B'||c.tagName==='STRONG')s+='**'+x.trim()+'**'+(/\s$/.test(x)?' ':'');
    else if(c.tagName==='CODE')s+='`'+x+'`';
    else if(c.tagName==='A')s+='['+x+']('+c.getAttribute('href')+')';
    else if(c.tagName==='BR')s+='\n';
    else s+=x;
  });
  return s;
}
function pageText(id){
  const out=['== '+id+' =='];
  pageNode(id).childNodes.forEach(el=>{
    if(el.tagName==='H3')out.push('\n# '+inl(el).trim());
    else if(el.tagName==='P')out.push(inl(el).trim());
    else if(el.tagName==='OL'||el.tagName==='UL')el.querySelectorAll(':scope > li').forEach(li=>{const s=li.getAttribute('data-step');out.push('- '+(s?'[step '+s+'] ':'')+inl(li).trim());});
    else if(el.tagName==='TABLE')el.querySelectorAll('tr').forEach(tr=>out.push('| '+[...tr.children].map(c=>inl(c).trim()).join(' | ')+' |'));
    else if(el.hasAttribute&&el.hasAttribute('data-cite'))out.push('cite block '+inl(el.querySelector('.cbt')).trim()+': '+el.querySelector('pre').textContent);
    else if(el.classList&&el.classList.contains('cb'))out.push('code block '+el.getAttribute('data-code')+' title: '+inl(el.querySelector('.cbt')).trim());
  });
  return out.join('\n');
}
function copyText(s){
  try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(s).catch(()=>{ta.select();document.execCommand('copy');});}catch(err){}
  ta.select();try{document.execCommand('copy');}catch(err){}
}
$('#e-save').addEventListener('click',()=>{
  const txt=pageText('source')+'\n\n'+pageText('data')+'\n\n'+pageText('cite');
  ta.value=txt;ov.hidden=false;ta.focus();ta.select();copyText(txt);
});
$('#copybtn').addEventListener('click',()=>{ta.select();copyText(ta.value);});
$('#copyclose').addEventListener('click',()=>{ov.hidden=true;});
$('#e-discard').addEventListener('click',()=>{
  if(!confirm('discard all your edits?'))return;
  Object.keys(pageCache).forEach(k=>delete pageCache[k]);dirty=false;showCurrentPage();
});

document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
  const t=b.dataset.tab,ch=t==='charts';homeTab=t;
  document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  stage.hidden=!ch;dotsEl.hidden=!ch;homePage.hidden=ch;
  if(ch){homePage.replaceChildren();place();renderCards();}else homePage.replaceChildren(pageNode(t));
  syncEdit();
}));

let rz=null;
addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{renderCards();if(openNow)refresh();},120);});

place();renderCards();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderCards();});
})();
</script>
